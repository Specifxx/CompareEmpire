name: probe-bigcommerce-dex
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-qu5ees]
    paths: [apps/dexcompare-sealed/probe/candidates.json]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/dexcompare-sealed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/dexcompare-sealed/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/probe-stores.ts --in probe/candidates.json --out probe/dex-bc-probe.json --concurrency 2 2>&1 | tee probe/dex-bc-probe.log
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add probe/ && git commit -m "probe: results" && git push origin HEAD:${{ github.ref_name }}
