name: Refresh DexCompare prices (daily)

# Daily live-price refresh for DexCompare: re-scrapes every store feed, updates
# RetailerPrice + each card's lowest price per market, and precomputes Deals
# (see the Deal model). The Vercel cron can't do this (the import takes ~an
# hour; serverless functions cap out at minutes), so it runs here on a schedule.
#
# Set the repo secret DEXCOMPARE_DATABASE_URL (the Neon pooled URL) to enable the
# schedule. Until then, scheduled runs skip with a notice; manual runs can paste
# the URL as an input instead.

on:
  # Re-enabled 2026-07-28 as part of the Neon-budget rebuild: DexCompare now
  # runs on its own dedicated Neon project (no longer sharing/competing with
  # RiftCompare's), and the whole point of the rebuild (precomputed Deals, no
  # history, capped/indexed queries) is that this daily run stays comfortably
  # inside that project's own free-tier allowance. Watch the consumption
  # watchdog for the first week to confirm.
  schedule:
    - cron: "30 18 * * *" # 04:30 Sydney (AEST) daily, before the AU morning
  workflow_dispatch:
    inputs:
      dexcompare_url:
        description: "DexCompare Neon DATABASE_URL (optional if the DEXCOMPARE_DATABASE_URL secret is set)"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve database URL
        id: db
        env:
          SECRET_URL: ${{ secrets.DEXCOMPARE_DATABASE_URL }}
          INPUT_URL: ${{ inputs.dexcompare_url }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "No DEXCOMPARE_DATABASE_URL secret and no URL input — skipping the refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "Add the secret in Settings → Secrets and variables → Actions to enable the daily schedule." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$URL"
            # Secrets can't travel via step outputs; hand it to later steps as an env var.
            echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20

      # DexCompare makes ZERO eBay API calls — that Browse quota belongs to
      # RiftCompare. EBAY_CLIENT_ID/SECRET are deliberately NOT passed here, so
      # this job cannot spend the quota even if code regressed. Only
      # EBAY_AFFILIATE_CAMPAIGN is provided: it just tags plain EPN search URLs
      # (src/lib/affiliate.ts) and calls no API.
      - name: Import live prices
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        env:
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          # Additive schema sync (new columns/tables) so the import can write them.
          npx prisma db push --skip-generate --accept-data-loss
          npx tsx scripts/import-prices.ts

      # Accuracy gate: fail the run if a core data invariant regressed (market
      # guide leaking into headline prices, or a spike of cards priced absurdly
      # below their TCGplayer guide).
      - name: Verify data quality
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        run: npx tsx scripts/verify-data.ts
