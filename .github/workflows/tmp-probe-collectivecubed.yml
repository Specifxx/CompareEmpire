name: tmp probe collectivecubed
on:
  push:
    branches: [claude/project-thread-gjx9ca]
    paths: [.github/workflows/tmp-probe-collectivecubed.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="DexCompareBot/1.0 (+https://dexcompare.io)"
          for h in delta-reign-booster-box pitch-black-booster-bundle perfect-order-booster-bundle ascended-heroes-booster-bundle 30th-celebration-elite-trainer-box obsidian-flames-elite-trainer-box silver-tempest-elite-trainer-box 30th-celebration-knock-out-collection ; do echo "== $h"; curl -s -m 30 -A "$UA" -w " HTTP %{http_code}\n" "https://collectivecubed.com/products/$h.json" -o p.json; jq -r '.product | "\(.title) | type=\(.product_type) | status=\(.published_at) | avail=\([.variants[].inventory_quantity // "?"])"' p.json 2>/dev/null; sleep 1; done
          for c in mega-evolution-new mega-evolution-ascended-heroes frontpage; do echo "=== $c"; curl -s -m 30 -A "$UA" "https://collectivecubed.com/collections/$c/products.json?limit=250" | jq -r '.products[] | select(.product_type|test("Single")|not) | "\(.title) | type=\(.product_type) | avail=\([.variants[].available]|any)"' | head -40; sleep 1; done
          echo "=== search"; curl -s -m 30 -A "$UA" "https://collectivecubed.com/search/suggest.json?q=booster%20box&resources[type]=product&resources[limit]=10" | jq -r '.resources.results.products[]? | "\(.title) | \(.available)"'
