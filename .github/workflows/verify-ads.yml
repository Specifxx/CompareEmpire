name: Verify TCGplayer banners live

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check banner markup on both production sites
        run: |
          set -u
          fail=0
          check() {
            local url="$1"
            local html
            html=$(curl -sL --max-time 30 "$url")
            local clicks creatives pixels
            clicks=$(grep -c "partner.tcgplayer.com/c/7385758" <<<"$html" || true)
            creatives=$(grep -c "a.impactradius-go.com/display-ad" <<<"$html" || true)
            pixels=$(grep -c "partner.tcgplayer.com/i/7385758" <<<"$html" || true)
            echo "$url  click-links=$clicks creatives=$creatives impression-pixels=$pixels"
            if [ "$clicks" -lt 1 ] || [ "$creatives" -lt 1 ] || [ "$pixels" -lt 1 ]; then
              echo "  ^ MISSING banner markup"
              fail=1
            fi
          }
          check "https://dexcompare.app/"
          check "https://riftcompare.com/"
          check "https://dexcompare.app/deals"
          check "https://dexcompare.app/browse"
          check "https://dexcompare.app/sealed"
          check "https://dexcompare.app/market"
          check "https://riftcompare.com/browse"
          check "https://riftcompare.com/sealed"
          check "https://riftcompare.com/market"
          check "https://dexcompare.app/dexdle"
          check "https://dexcompare.app/games"
          check "https://dexcompare.app/games/duel"
          check "https://dexcompare.app/games/rip"
          check "https://dexcompare.app/games/catcher"
          check "https://dexcompare.app/games/breaker"
          check "https://riftcompare.com/riftle"
          check "https://riftcompare.com/games"
          check "https://riftcompare.com/games/higher-lower"
          check "https://riftcompare.com/games/pairs"
          check "https://riftcompare.com/games/price-check"
          check "https://riftcompare.com/games/zoomed"
          exit $fail

      - name: Check Sovrn link wrapping on store links
        run: |
          set -u
          fail=0
          sovrn() {
            local label="$1" html="$2"
            local wrapped
            wrapped=$(grep -o "redirect.viglink.com" <<<"$html" | wc -l)
            echo "$label  sovrn-wrapped-links=$wrapped"
            if [ "$wrapped" -lt 1 ]; then echo "  ^ NO Sovrn-wrapped links"; fail=1; fi
          }
          # rift /sealed renders store buy links server-side.
          sovrn "riftcompare.com/sealed" "$(curl -sL --max-time 30 https://riftcompare.com/sealed)"
          # dex: store links live on card pages — grab one off the homepage.
          card=$(curl -sL --max-time 30 https://dexcompare.app/ | grep -o 'href="/card/[^"]*"' | head -1 | sed 's/href="//;s/"//')
          echo "dex sample card: $card"
          sovrn "dexcompare.app$card" "$(curl -sL --max-time 30 "https://dexcompare.app$card")"
          # Install snippet must appear in the RAW HTML exactly ONCE and inside
          # <body> — Sovrn's verifier rejects "not found", "multiple instances"
          # AND head placement ("place code directly before </body>").
          # Click-through test: take a real Sovrn-wrapped href off the live site,
          # follow it like a user click, and confirm Sovrn logs+redirects to the
          # merchant (this is exactly the activity Sovrn's application needs).
          link=$(curl -sL --max-time 30 https://riftcompare.com/sealed | grep -o 'https://redirect.viglink.com/[^"]*' | head -1 | sed 's/&amp;/\&/g')
          echo "sample sovrn click link: ${link:0:140}..."
          final=$(curl -s -o /dev/null -w "%{http_code} %{url_effective}" -L --max-time 30 "$link")
          echo "click-through result: $final"
          case "$final" in
            2*viglink*) echo "  ^ ended ON viglink (no merchant redirect)"; fail=1 ;;
            2*) echo "  ^ click logged by Sovrn and redirected to merchant OK" ;;
            *) echo "  ^ unexpected result"; fail=1 ;;
          esac
          python3 - <<'PY' || fail=1
          import urllib.request
          import sys
          bad = 0
          for site in ["https://dexcompare.app/", "https://riftcompare.com/"]:
              html = urllib.request.urlopen(site, timeout=30).read().decode("utf-8", "replace")
              n = html.count("viglink.com/api/vglnk.js")
              body = html.find("<body")
              pos = html.find("var vglnk")
              in_body = body != -1 and pos > body
              # AdSense review reads raw HTML: the official snippet must be in <head>.
              ads = html.find("pagead2.googlesyndication.com/pagead/js/adsbygoogle.js")
              ads_in_head = ads != -1 and ads < body
              print(f"{site}  sovrn-occurrences={n} sovrn-in-body={in_body} adsbygoogle-in-head={ads_in_head}")
              if n != 1 or not in_body or not ads_in_head:
                  print("  ^ expected 1 Sovrn snippet in <body> and adsbygoogle in <head>")
                  bad = 1
          sys.exit(bad)
          PY
          exit $fail
