name: tmp dex UK probe
on:
  push:
    branches: [claude/project-thread-5nzpz1]
    paths: [".github/workflows/tmp-dex-uk-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/dexcompare-sealed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: zatu ETB collection guesses
        run: |
          for c in pokemon-tcg-elite-trainer-boxes elite-trainer-boxes-pokemon pokemon-elite-trainer-boxes elite-trainer-boxes pokemon-etb pokemon-tcg-etbs pokemon-tcg-sealed pokemon-tcg pokemon; do n=$(curl -s -A "DexCompare price check (dexcompare.io)" "https://zatu.com/collections/$c/products.json?limit=250" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s).products;console.log(p.length, p.filter(x=>/elite trainer/i.test(x.title)).length)}catch{console.log("ERR")}})'); echo "zatu $c $n"; sleep 1; done
      - name: verify the added collections
        env:
          ADD: '{"collect":["pokemon-tcg"],"collectorskingdom":["english-pokemon"],"hoctcg":["pokemon-1"],"1moregogaming":["pokemon-battle-decks"],"trolltradercards":["pokemon-booster-boxes"],"koolthings":["pokemon"],"elemental":["pokemon"],"nortontcg":["pokemon-tcg"],"impactleague":["english-etb-ex-boxes-and-other-sealed-products","pokemon-booster-packs","pokemon-booster-boxes"],"justplaygames":["pokemon-league-preorders"],"tierzerogames":["pokemon"],"buyanycards":["pokemon-mini-tins"],"collectorsedge":["pokemon-tcg-booster-bundles-boxes"],"cosmiccollectables":["booster-boxes"],"eternacards":["all-pokemon-booster-packs"]}'
        run: npx tsx tmp-verify.ts
