name: Import real AU prices (DexCompare)

# Scrapes Australian Pokémon Shopify stores and writes REAL prices + product URLs
# into DexCompare's AU market (replaces the synthetic AU estimates). Recomputes the
# AU lowest for priced cards. Leaves US/NZ/UK untouched.

on:
  workflow_dispatch:
    inputs:
      dexcompare_url:
        description: "DexCompare Neon DATABASE_URL (pooled)"
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mask
        run: echo "::add-mask::${{ inputs.dexcompare_url }}"
      - name: Import AU prices
        working-directory: apps/dexcompare
        env:
          DATABASE_URL: ${{ inputs.dexcompare_url }}
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npx tsx scripts/import-au-prices.ts
