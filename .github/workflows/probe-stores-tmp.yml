name: Probe candidate stores (temporary)
on:
  push:
    branches: [claude/project-thread-b0zlww]
    paths: [.github/workflows/probe-stores-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="DexCompare store probe (contact: compareempire@gmail.com)"
          echo "== kingcard pokemon handles"
          for p in 1 2 3; do curl -s -m 30 -A "$UA" "https://kingcard.ca/collections.json?limit=250&page=$p" | jq -r '.collections[]?|"\(.handle)\t\(.products_count)\t\(.title)"'; sleep 1; done | grep -i -E 'pok|^all|sealed|tcg' | head -80
          for c in elite-trainer-boxes booster-boxes pokemon-tins; do echo "== kingcard $c"; curl -s -m 30 -A "$UA" "https://kingcard.ca/collections/$c/products.json?limit=12" | jq -r '.products[]?|"\(.title)\t\(.variants[0].price)\t\(.variants[0].available)"'; sleep 1; done
          echo "== zentra all-pokemon-tcg"
          curl -s -m 30 -A "$UA" "https://zentrapulltcg.com/wp-json/wc/store/v1/products?category=all-pokemon-tcg&per_page=50" | jq -r '.[]?|"\(.name)\t\(.prices.price)\t\(.is_in_stock)"' | head -50
