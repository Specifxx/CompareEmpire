name: Neon usage watchdog

# Early warning for the failure mode that has now killed TWO databases: the
# free tier's 5 GB/month network-transfer allowance running out silently.
# Checks Neon's consumption API daily and FAILS the run (= email from GitHub)
# when transfer crosses the warning thresholds, while there is still time to
# find the leak — instead of discovering it when the database stops answering.
#
# Setup (one-time): Neon console → Account settings → API keys → create key →
# add it as the NEON_API_KEY repository secret. Until then the run just
# explains what's missing (and fails so it can't be forgotten).

on:
  schedule:
    - cron: "30 19 * * *" # daily, ~1h after the price refresh (the biggest consumer)
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Neon network-transfer consumption
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, os, sys, urllib.request

          key = os.environ.get("NEON_API_KEY", "")
          if not key:
              print("NEON_API_KEY secret is not set.")
              print("Create one in Neon console → Account settings → API keys,")
              print("then add it as a repository secret named NEON_API_KEY.")
              sys.exit(1)

          LIMIT_GB = 5.0
          WARN_PCT, CRIT_PCT = 50, 75

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {key}", "Accept": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=30))

          # Neon migrated personal accounts under ORGANIZATIONS, and these endpoints
          # 400 without an org_id for org-scoped accounts. Discover it best-effort.
          org_id = None
          try:
              orgs = get("https://console.neon.tech/api/v2/users/me/organizations").get("organizations", [])
              if orgs:
                  org_id = orgs[0].get("id")
                  print(f"Using Neon org_id={org_id}")
          except Exception as e:
              print(f"(org lookup skipped: {e})")
          org_q = f"&org_id={org_id}" if org_id else ""

          # Billing period ≈ calendar month on the free plan.
          now = dt.datetime.now(dt.timezone.utc)
          frm = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          qs = (f"from={frm.strftime('%Y-%m-%dT%H:%M:%SZ')}"
                f"&to={now.strftime('%Y-%m-%dT%H:%M:%SZ')}"
                f"&granularity=daily{org_q}")
          # The consumption endpoint shape varies by account type, so try a few.
          candidates = [
              f"https://console.neon.tech/api/v2/consumption_history/account?{qs}",
              f"https://console.neon.tech/api/v2/consumption_history/projects?{qs}&limit=100",
          ]
          data = None
          for u in candidates:
              try:
                  data = get(u); break
              except Exception as e:
                  print(f"(consumption endpoint {u.split('/v2/')[1].split('?')[0]} failed: {e})")
          if data is None:
              # Don't fail the daily run for an API-compat hiccup — the alert exists
              # for HIGH USAGE, not transient read errors. Check the dashboard instead.
              print("Could not read Neon consumption via API — check usage directly: Neon dashboard → Billing / Usage.")
              sys.exit(0)

          # Deep-scan the response for data_transfer_bytes (shape differs per endpoint).
          def sum_transfer(node):
              t = 0
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "data_transfer_bytes" and isinstance(v, (int, float)):
                          t += v
                      else:
                          t += sum_transfer(v)
              elif isinstance(node, list):
                  for v in node:
                      t += sum_transfer(v)
              return t

          gb = sum_transfer(data) / 1e9
          pct = 100 * gb / LIMIT_GB
          print(f"\nNeon transfer this billing period: {gb:.2f} GB ({pct:.0f}% of {LIMIT_GB} GB)")
          if pct >= CRIT_PCT:
              print(f"🚨 {pct:.0f}% used — find the leak NOW (check Vercel logs for [egress-guard] warnings).")
              sys.exit(1)
          if pct >= WARN_PCT:
              print(f"⚠️ {pct:.0f}% used — ahead of pace, keep an eye on it.")
              sys.exit(1)
          print(f"✅ {pct:.0f}% used — healthy.")
          PY
