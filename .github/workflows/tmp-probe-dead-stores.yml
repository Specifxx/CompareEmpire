name: tmp probe dead stores
on:
  push:
    branches: [claude/project-thread-a6e1to]
    paths: [.github/workflows/tmp-probe-dead-stores.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="DexCompareBot/1.0 (+https://dexcompare.io)"
          shop() { b=$1; echo "===== $b"; curl -s -o /dev/null -w "home %{http_code} -> %{redirect_url}\n" -A "$UA" "$b/"; curl -s -A "$UA" -o /tmp/c.json -w "collections.json %{http_code}\n" "$b/collections.json?limit=250"; python3 -c "
          import json,sys
          try:
            d=json.load(open('/tmp/c.json'));cs=d.get('collections',[])
            print('n collections',len(cs))
            for c in cs:
              h=c['handle'];t=c['title']
              if any(w in (h+t).lower() for w in ['poke','sealed','tcg','booster']): print('  ',h,'|',t,'|',c.get('products_count'))
          except Exception as e: print('bad json',e)"; for h in "${@:2}"; do curl -s -A "$UA" -o /tmp/p.json -w "  coll $h %{http_code} " "$b/collections/$h/products.json?limit=250"; python3 -c "
          import json
          try: print(len(json.load(open('/tmp/p.json')).get('products',[])),'products')
          except Exception as e: print('bad',e)"; done; curl -s -A "$UA" -o /tmp/a.json -w "  all products.json %{http_code} " "$b/products.json?limit=250"; python3 -c "
          import json
          try:
            p=json.load(open('/tmp/a.json')).get('products',[]);print(len(p),'products; pokemon-ish',sum('pok' in x['title'].lower() for x in p))
          except Exception as e: print('bad',e)"; }
          woo() { b=$1; echo "===== $b"; curl -s -o /dev/null -w "home %{http_code} -> %{redirect_url}\n" -A "$UA" "$b/"; curl -s -A "$UA" -o /tmp/c.json -w "categories %{http_code}\n" "$b/wp-json/wc/store/v1/products/categories?per_page=100"; python3 -c "
          import json
          try:
            d=json.load(open('/tmp/c.json'))
            for c in d:
              if 'pok' in (c['slug']+c['name']).lower(): print('  ',c['slug'],'|',c['name'],'|',c.get('count'))
          except Exception as e: print('bad',e, open('/tmp/c.json').read()[:200])"; }
          shop https://millenniumcomics.com.au tcg-sealed pokemon-model-kit
          shop https://obsessiongaming.com.au pokemon-boosters pokemon-starter-decks
          shop https://kumacards.com pokemon
          shop https://southtexastcg.com pokemon-booster-packs
          shop https://twinfusecollectibles.com sealed
          woo https://eldartcg.com
          woo https://industria61.com
          woo https://tradingcardgamestore.com
