name: Refresh TCGPriceEmpire catalogue (daily)

# Daily import of all five games' catalogues + prices (TCGplayer, Scryfall,
# YGOPRODeck) into the TCGPriceEmpire database, then a data-quality gate.
#
# Set the repo secret TCGPRICEEMPIRE_DATABASE_URL (the Neon pooled URL) to
# enable the schedule. Until then, scheduled runs skip with a notice; manual
# runs can paste the URL as an input instead. The optional `game` input limits
# a manual run to one game (pokemon | magic | yugioh | onepiece | riftbound).

on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC daily — clear of the 18:00/18:30 sister-site runs
  workflow_dispatch:
    inputs:
      database_url:
        description: "TCGPriceEmpire Neon DATABASE_URL (optional if the secret is set)"
        required: false
        default: ""
      game:
        description: "Limit to one game (pokemon|magic|yugioh|onepiece|riftbound); empty = all"
        required: false
        default: ""

concurrency:
  group: tcgpriceempire-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Resolve database URL
        id: db
        env:
          SECRET_URL: ${{ secrets.TCGPRICEEMPIRE_DATABASE_URL }}
          INPUT_URL: ${{ inputs.database_url }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "No TCGPRICEEMPIRE_DATABASE_URL secret and no URL input — skipping the refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "Add the secret in Settings → Secrets and variables → Actions to enable the daily schedule." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$URL"
            echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20

      - name: Import catalogue + prices
        if: steps.db.outputs.found == 'true'
        working-directory: apps/tcgpriceempire
        env:
          GAME: ${{ inputs.game }}
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          # Additive schema sync so the import can write new columns/tables.
          npx prisma db push --skip-generate --accept-data-loss
          # The Scryfall bulk file parse needs headroom beyond node's default heap.
          NODE_OPTIONS=--max-old-space-size=6144 npx tsx scripts/import-catalog.ts

      - name: Verify data quality
        if: steps.db.outputs.found == 'true'
        working-directory: apps/tcgpriceempire
        run: npx tsx scripts/verify-data.ts

      # Price-drop alert emails — runs after the fresh prices land. Without the
      # RESEND_API_KEY secret this is a no-op (alert rows stay pending).
      - name: Run price alerts
        if: steps.db.outputs.found == 'true'
        working-directory: apps/tcgpriceempire
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: npx tsx scripts/run-alerts.ts
