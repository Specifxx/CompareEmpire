name: tmp probe collectivecubed
on:
  push:
    branches: [claude/project-thread-gjx9ca]
    paths: [.github/workflows/tmp-probe-collectivecubed.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="DexCompareBot/1.0 (+https://dexcompare.io)"
          echo "=== all collections"
          for p in 1 2; do curl -s -m 30 -A "$UA" "https://collectivecubed.com/collections.json?limit=250&page=$p" | jq -r '.collections[] | "\(.handle) \(.products_count) \(.title)"'; done
          echo "=== sealed-looking products in /products.json"
          for p in 1 2 3 4 5 6 7 8; do curl -s -m 30 -A "$UA" "https://collectivecubed.com/products.json?limit=250&page=$p" | jq -r '.products[] | select(.product_type|test("Single")|not) | "\(.title) | type=\(.product_type) | avail=\([.variants[].available]|any) | \(.handle)"'; sleep 1; done | head -120
          echo "=== old handle"
          curl -s -m 30 -A "$UA" -o /dev/null -w "%{http_code} %{redirect_url}\n" "https://collectivecubed.com/collections/pokemon-sealed"
