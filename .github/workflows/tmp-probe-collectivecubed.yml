name: tmp probe collectivecubed
on:
  push:
    branches: [claude/project-thread-gjx9ca]
    paths: [.github/workflows/tmp-probe-collectivecubed.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="DexCompareBot/1.0 (+https://dexcompare.io)"
          shop() { b=$1; shift; echo "##### $b"; for c in "$@"; do printf "  %s: " "$c"; curl -s -m 30 -A "$UA" -o p.json -w "HTTP %{http_code} " "$b/collections/$c/products.json?limit=250"; jq -r '"\(.products|length) products"' p.json 2>/dev/null || head -c 150 p.json; echo; sleep 1; done
            echo "  collections:"; curl -s -m 30 -A "$UA" "$b/collections.json?limit=250" -o c.json -w "  HTTP %{http_code}\n"; jq -r '.collections[] | select(.handle|test("pok|seal|booster|etb|tin";"i")) | "    \(.handle) \(.products_count)"' c.json 2>/dev/null | head -25 || head -c 200 c.json; sleep 1; }
          woo() { b=$1; shift; echo "##### $b"; curl -s -m 30 -A "$UA" -o w.json -w "  cats HTTP %{http_code}\n" "$b/wp-json/wc/store/v1/products/categories?per_page=100"; jq -r '.[] | select(.slug|test("pok|seal";"i")) | "    \(.slug) id=\(.id) \(.count)"' w.json 2>/dev/null | head -20 || head -c 300 w.json; echo; curl -s -m 30 -A "$UA" -o w2.json -w "  products HTTP %{http_code}\n" "$b/wp-json/wc/store/v1/products?per_page=5&search=pokemon"; head -c 300 w2.json; echo; sleep 1; }

          shop https://cardworld.be pokemon-booster-packs-engels pokemon-booster-boxen-engels
          shop https://collectorclash.com pokemon
          shop https://treasurevaultau.com pokemon
          woo https://rarepokemoncards.co.uk
          woo https://koffie-spel.be
