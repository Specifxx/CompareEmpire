name: Seed Neon databases

# Seeds CameraCompare and DexCompare into their Neon Postgres databases.
# Runs on GitHub's runners (open internet), since the dev container can't reach Neon.
# Trigger from the Actions tab → "Seed Neon databases" → Run workflow, pasting each
# app's Neon DATABASE_URL. (The URLs are masked in logs; rotate the DB password
# afterwards if you like — it's one click in Neon.)

on:
  workflow_dispatch:
    inputs:
      cameracompare_url:
        description: "CameraCompare Neon DATABASE_URL (pooled, sslmode=require)"
        required: true
      dexcompare_url:
        description: "DexCompare Neon DATABASE_URL (pooled, sslmode=require)"
        required: true
      carcompare_url:
        description: "CarCompare Neon DATABASE_URL (pooled, sslmode=require)"
        required: false
        default: ""
      phonecompare_url:
        description: "PhoneCompare Neon DATABASE_URL (pooled, sslmode=require)"
        required: false
        default: ""
      seed_cameracompare:
        description: "Seed CameraCompare?"
        type: boolean
        default: true
      seed_dexcompare:
        description: "Seed DexCompare?"
        type: boolean
        default: true
      seed_carcompare:
        description: "Seed CarCompare?"
        type: boolean
        default: false
      seed_phonecompare:
        description: "Seed PhoneCompare?"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mask connection strings in logs
        run: |
          echo "::add-mask::${{ inputs.cameracompare_url }}"
          echo "::add-mask::${{ inputs.dexcompare_url }}"
          echo "::add-mask::${{ inputs.carcompare_url }}"
          echo "::add-mask::${{ inputs.phonecompare_url }}"

      - name: Seed CameraCompare
        if: ${{ inputs.seed_cameracompare }}
        working-directory: apps/cameracompare
        env:
          DATABASE_URL: ${{ inputs.cameracompare_url }}
        run: |
          npm install --no-audit --no-fund
          npx tsx scripts/fetch-camera-images.ts || echo "image fetch failed; seeding with placeholders"
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Seed DexCompare
        if: ${{ inputs.seed_dexcompare }}
        working-directory: apps/dexcompare
        env:
          DATABASE_URL: ${{ inputs.dexcompare_url }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: |
          npm install --no-audit --no-fund
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Create CarCompare database on Neon (additive, idempotent)
        if: ${{ inputs.seed_carcompare }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # Connect to the existing dexcompare DB on the same Neon project and
          # create the carcompare database if it doesn't already exist.
          psql "${{ inputs.dexcompare_url }}" -tc "SELECT 1 FROM pg_database WHERE datname='carcompare'" | grep -q 1 \
            || psql "${{ inputs.dexcompare_url }}" -c "CREATE DATABASE carcompare" \
            || echo "create skipped (may already exist)"

      - name: Seed CarCompare
        if: ${{ inputs.seed_carcompare }}
        working-directory: apps/carcompare
        env:
          DATABASE_URL: ${{ inputs.carcompare_url }}
        run: |
          npm install --no-audit --no-fund
          npx tsx scripts/fetch-car-images.ts || echo "image fetch failed; seeding with placeholders"
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Create PhoneCompare database on Neon (additive, idempotent)
        if: ${{ inputs.seed_phonecompare }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "${{ inputs.dexcompare_url }}" -tc "SELECT 1 FROM pg_database WHERE datname='phonecompare'" | grep -q 1 \
            || psql "${{ inputs.dexcompare_url }}" -c "CREATE DATABASE phonecompare" \
            || echo "create skipped (may already exist)"

      - name: Seed PhoneCompare
        if: ${{ inputs.seed_phonecompare }}
        working-directory: apps/phonecompare
        env:
          DATABASE_URL: ${{ inputs.phonecompare_url }}
        run: |
          npm install --no-audit --no-fund
          npx tsx scripts/fetch-phone-images.ts || echo "image fetch failed; seeding with placeholders"
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Done
        run: echo "Seeding complete. Your Neon databases are populated."
