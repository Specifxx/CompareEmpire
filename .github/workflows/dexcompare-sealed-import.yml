name: DexCompare sealed import

# Reads every store in apps/dexcompare-sealed/src/data/stores.json and TCGplayer's
# Pokémon sealed catalogue (its public search API, ~60 requests, one a second,
# no credentials; src/lib/tcgplayer.ts), replaces the current listings in the
# DexCompare database, then asks the live site to re-render its cached pages.
# Twice a day. No eBay API calls: no eBay credentials are passed to this job at
# all.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DC2                              read ONCE (a secret or a variable): the old Neon database. Since 2026-11-23 (owner:
#                                    "Dc2 is at limit") the job runs on its own throwaway Postgres, loaded from and saved
#                                    back to the branch dexcompare-db (apps/dexcompare-sealed/scripts/db-snapshot.sh); DC2
#                                    is read only by the first run, when that branch does not exist yet.
#   DEXCOMPARE_REVALIDATE_SECRET     optional. Same value as REVALIDATE_SECRET in
#                                    Vercel; without it pages refresh within 24h.
# Variable (same page, "Variables" tab):
#   DEXCOMPARE_SITE_URL              e.g. https://dexcompare.io
#
# A NEW secret name on purpose: the paused workflows from the old singles app
# (refresh-dexcompare-prices.yml, seed-dexcompare-fresh.yml, …) read
# DEXCOMPARE_DATABASE_URL and some of them reset the database they point at.

on:
  # A merge that changes the schema syncs it straight away (with a quick
  # TCGplayer-only run that also recomputes every product's stats), so the
  # deploy it triggers never renders against a database missing a column.
  push:
    branches: [main]
    paths: ["apps/dexcompare-sealed/prisma/schema.prisma"]
  schedule:
    # 20:47 UTC ≈ early morning in Australia/NZ; 08:47 UTC ≈ Europe's morning.
    - cron: "47 20 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      # Store keys and markets; "tcgplayer" (or "US") includes TCGplayer.
      only:
        description: "Only these stores or markets, comma-separated (e.g. AU or pokebox,cherry). Blank = all."
        required: false
        default: ""

# ONE group for both data jobs (this and dexcompare-ebay-import.yml): each loads the database snapshot and saves it back, so
# two at once would lose one job's writes.
concurrency:
  group: dexcompare-data
  cancel-in-progress: false

# Writes the public data snapshot to main after the import (scripts/publish-public-data.sh).
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOCAL_URL: postgresql://postgres:postgres@localhost:5432/dex
    defaults:
      run:
        working-directory: apps/dexcompare-sealed
    steps:
      # The job's own database (owner, 2026-11-23: DC2, the Neon project, was at its limit): a Postgres service on this
      # runner, loaded from the snapshot branch dexcompare-db and saved back after the import (scripts/db-snapshot.sh). DC2's
      # direct host is passed as SEED_URL, read only when no snapshot exists yet (the one-time copy, every count checked).
      - name: Resolve the database
        id: db
        working-directory: .
        env:
          DC2: ${{ secrets.DC2 || vars.DC2 }}
          LEGACY: ${{ secrets.DEXCOMPARE_SEALED_DATABASE_URL }}
        run: |
          SEED="$(printf '%s' "${DC2:-$LEGACY}" | sed -E 's/-pooler\././')"
          if [ -n "$SEED" ]; then echo "::add-mask::$SEED"; echo "SEED_URL=$SEED" >> "$GITHUB_ENV"; fi
          echo "DATABASE_URL=$LOCAL_URL" >> "$GITHUB_ENV"
          echo "DB_SOURCE_NAME=actions-postgres" >> "$GITHUB_ENV"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dexcompare-sealed/package-lock.json

      - name: Install
        if: steps.db.outputs.found == 'true'
        run: npm ci --no-audit --no-fund

      - name: Sync the schema
        if: steps.db.outputs.found == 'true'
        # No --accept-data-loss: a schema change that would drop data fails
        # here, loudly, instead of quietly deleting it.
        run: npx prisma db push --skip-generate && npx prisma generate

      - name: Load the database
        id: load
        if: steps.db.outputs.found == 'true'
        run: bash scripts/db-snapshot.sh restore

      # New sets find themselves (apps/dexcompare-sealed/src/lib/set-discovery.ts): TCGplayer's upcoming sets go into
      # data/sets/discovered.json before the stores are read, so a newly announced set's pre-orders are filed under it in this
      # same run, and its pre-order page, set page and Coming soon slot appear with the release. Never fails the run.
      - name: Discover new sets
        if: steps.db.outputs.found == 'true'
        run: npx tsx scripts/discover-sets.ts

      # TCGplayer's barcodes for sealed product (scripts/tcg-barcodes.ts, data/barcodes/tcgplayer.json): the product page's
      # Quick facts and Product markup. Public catalogue, no key; never fails the run.
      - name: TCGplayer barcodes
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: npx tsx scripts/tcg-barcodes.ts

      - name: Import
        if: steps.db.outputs.found == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.DEXCOMPARE_REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.DEXCOMPARE_SITE_URL || 'https://dexcompare.io' }}
          ONLY: ${{ github.event_name == 'push' && 'tcgplayer' || inputs.only }}
          # The expired-eBay-listing purge at the end of the import uses the same age bound as the eBay import
          # (a repository variable; blank = 26 hours).
          EBAY_LISTING_MAX_AGE_HOURS: ${{ vars.EBAY_LISTING_MAX_AGE_HOURS }}
        # Three stores at a time: Shopify throttles by IP across all of its
        # storefronts, and a runner reading ten at once gets 429s from stores
        # it has barely touched. TCGplayer is read first, in one of the three
        # slots (~1.5 min, 15 min at most); a failed TCGplayer read keeps its
        # previous rows and warns, and the job fails once TCGplayer has gone
        # unread for 48 hours.
        run: |
          if [ -n "$ONLY" ]; then
            npx tsx scripts/import.ts --concurrency 3 --only "$ONLY"
          else
            npx tsx scripts/import.ts --concurrency 3
          fi

      # Saved even when the import fails part way, as Neon kept every write; never when the load itself failed.
      - name: Save the database
        if: always() && steps.load.outcome == 'success'
        env:
          WHY: dexcompare-sealed-import.yml run ${{ github.run_id }}
        run: bash scripts/db-snapshot.sh save

      # The site reads these files, not the database (apps/dexcompare-sealed/src/lib/public-data/): export every public table and
      # commit it to main, which is the release that puts this import's prices live.
      - name: Export the public data
        if: steps.db.outputs.found == 'true'
        run: npx tsx scripts/export-public-data.ts

      # The deal and restock feed (apps/dexcompare-sealed/src/lib/feed.ts): OFF unless the repository variable FEED_ENABLED is 1 and a
      # destination is set (secret DISCORD_WEBHOOK_URL or DISCORD_DEALS_WEBHOOK, the Compare Empire server #pokemon-deals, 18 Nov; secret TELEGRAM_BOT_TOKEN with variable TELEGRAM_CHAT_ID). It reads the files
      # just exported, posts at most FEED_MAX_POSTS (default 6) new events, and writes data/public/feed-state.json, which the publish
      # step commits with the data. Never fails the import.
      # Amazon ASINs (Creators API searchItems, AMAZON_SEARCH_BUDGET a region a day) for the product pages' Amazon row,
      # matched by the sealed classifier. ASINs only: Amazon prices are fetched by each Vercel build and never committed
      # (DECISIONS.md 2026-11-05). A no-op until the secrets exist; never fails the run.
      - name: Amazon ASINs (Creators API)
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        env:
          AMAZON_CREATORS_AU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_ID }}
          AMAZON_CREATORS_AU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_AU_CLIENT_SECRET }}
          AMAZON_CREATORS_AU_VERSION: ${{ secrets.AMAZON_CREATORS_AU_VERSION }}
          AMAZON_CREATORS_US_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_US_CLIENT_ID }}
          AMAZON_CREATORS_US_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_US_CLIENT_SECRET }}
          AMAZON_CREATORS_US_VERSION: ${{ secrets.AMAZON_CREATORS_US_VERSION }}
          # Canada, the UK and Germany each need their own account's credentials (an AU or US credential is refused for their
          # tags, status-<region>.json "InvalidAssociate"); unset, they fall back to AU's and stay refused (site review DEX-1).
          AMAZON_CREATORS_CA_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_ID }}
          AMAZON_CREATORS_CA_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CA_CLIENT_SECRET }}
          AMAZON_CREATORS_CA_VERSION: ${{ secrets.AMAZON_CREATORS_CA_VERSION }}
          AMAZON_CREATORS_UK_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_ID }}
          AMAZON_CREATORS_UK_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_UK_CLIENT_SECRET }}
          AMAZON_CREATORS_UK_VERSION: ${{ secrets.AMAZON_CREATORS_UK_VERSION }}
          AMAZON_CREATORS_EU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_ID }}
          AMAZON_CREATORS_EU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_SECRET }}
          AMAZON_CREATORS_EU_VERSION: ${{ secrets.AMAZON_CREATORS_EU_VERSION }}
        run: npx tsx scripts/amazon-asins.ts

      - name: Deal and restock feed
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        env:
          FEED_ENABLED: ${{ vars.FEED_ENABLED }}
          FEED_REGIONS: ${{ vars.FEED_REGIONS }}
          FEED_MAX_POSTS: ${{ vars.FEED_MAX_POSTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_DEALS_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/feed-notify.ts
      # The Compare Empire network (apps/dexcompare-sealed DECISIONS.md "Sites that grow each other"): this site's best deals for
      # the sister sites, and their feeds for the "Other card games on sale" block. Reads the files just exported; never fails.
      - name: Family feed
        if: steps.db.outputs.found == 'true'
        run: PUBLIC_DATA_MODE=files npx tsx scripts/family-sync.ts
      # The home pages' ranking input (src/lib/home-rank.ts, DECISIONS.md 2026-11-18): product page views and buy clicks per
      # product, last 28 and 7 days, from RiftCompare's /api/demand/dex, committed with no deploy marker before the release below
      # so the release bundles it. Never fatal: a failed fetch keeps yesterday's file.
      - name: Home page demand
        continue-on-error: true
        working-directory: .
        run: bash apps/dexcompare-sealed/scripts/pull-demand.sh dex apps/dexcompare-sealed/data/demand.json
      - name: Publish it to main
        if: steps.db.outputs.found == 'true'
        working-directory: .
        # EVERY RUN RELEASES (owner, 2026-11-23 UX review, P0 2: pages said "checked 30 hours ago" against our "twice a day").
        # Until then only the 20:47 UTC run carried [deploy]; GitHub starts scheduled runs hours late, so that release often
        # landed within 12 hours of another build, the gate skipped it and the live prices aged a day and more. Both runs now
        # carry the marker; scripts/vercel-ignore-build.sh still allows at most one production build per 12 hours (owner,
        # 2026-11-02), so this is at most two a day. dexcompare-freshness.yml raises the alarm when the data is over 12 hours old.
        env:
          PUBLISH_FEED_STATE: "1"
          RELEASE: release
        run: bash apps/dexcompare-sealed/scripts/publish-public-data.sh "dexcompare-sealed-import.yml run ${{ github.run_id }}" $RELEASE
