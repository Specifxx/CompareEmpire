name: Probe candidate stores (temporary)
on:
  push:
    branches: [claude/project-thread-oscc7y]
    paths: [.github/workflows/probe-stores-tmp.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="DexCompare store probe (contact: compareempire@gmail.com)"
          b=https://elite4tcg.com
          echo "== elite4"
          curl -s -m 30 -A "$UA" "$b/collections.json?limit=250" | jq -r '.collections[]?|select(.handle|test("pokemon|booster|box|etb|tin|bundle|sealed";"i"))|"\(.handle) \(.products_count)"' | head -20
          echo "== primepull (woo)"
          curl -s -m 30 -A "$UA" "https://primepulltcg.com/wp-json/wc/store/v1/products/categories?per_page=50" | jq -r '.[]?|"\(.slug) \(.count)"' | head -30
          curl -s -m 30 -A "$UA" -o /dev/null -w "primepull robots %{http_code}\n" https://primepulltcg.com/robots.txt
          echo "== jaytolmes"
          curl -s -m 30 -A "$UA" -o /dev/null -w "products.json %{http_code}\n" https://jaytolmes-tcg.com/products.json
