name: tmp probe low-coverage stores
on:
  push:
    branches: [claude/project-thread-lej8jg]
    paths: [.github/workflows/tmp-probe-low-stores.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/dexcompare-sealed } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/tmp-why.ts
