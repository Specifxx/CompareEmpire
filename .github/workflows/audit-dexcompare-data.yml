name: Audit DexCompare data quality (manual, read-only)

# Diagnostic for the Check-B flags from the daily price refresh: lists the AU
# cards priced below 40% of their TCGplayer guide and classifies the likely cause
# (played condition / non-holo variant / genuine name+number mismatch / stale
# guide). Read-only — runs NO import and writes nothing to the database. Trigger
# manually from the Actions tab; reads the same DEXCOMPARE_DATABASE_URL secret as
# the refresh workflow.
on:
  workflow_dispatch:
    inputs:
      dexcompare_url:
        description: "DexCompare Neon DATABASE_URL (optional if the DEXCOMPARE_DATABASE_URL secret is set)"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve database URL
        id: db
        env:
          SECRET_URL: ${{ secrets.DEXCOMPARE_DATABASE_URL }}
          INPUT_URL: ${{ inputs.dexcompare_url }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "No DEXCOMPARE_DATABASE_URL secret and no URL input — nothing to audit." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$URL"
            echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20

      - name: Run suspicious-price audit (read-only)
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npx tsx scripts/audit-suspicious.ts
