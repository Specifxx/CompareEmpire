name: Neon usage watchdog (DexCompare)

# Proactive early-warning for DexCompare's Neon free-tier allowance, so a slow
# creep back toward the old 3.3 GB/day burn is caught in days, not discovered
# as another PrismaClientInitializationError outage. Polls Neon's consumption
# API once a day, compares data-transfer (egress) used-so-far against the
# monthly cap PRO-RATED by day-of-month (so "50% used on day 10" alerts even
# though it's well under 50% of the raw monthly number), and posts to Discord
# at 50/75/90%.
#
# ONE-TIME SETUP (repo secrets, Settings → Secrets and variables → Actions):
#   NEON_API_KEY            — Neon account settings → API keys → Create new
#   NEON_DEXCOMPARE_PROJECT_ID — the DexCompare Neon project's ID (dashboard
#                                 URL: console.neon.tech/app/projects/<this>)
#   NEON_EGRESS_CAP_GB      — optional, defaults to 5 (the free-tier monthly
#                              data-transfer allowance in GB)
#   DISCORD_WEBHOOK_URL     — optional; without it, results only appear in the
#                              workflow's own log/summary
#
# Skips gracefully (no failure) if NEON_API_KEY or the project id isn't set —
# matches this repo's existing pattern for optional integrations.
#
# NOTE: this calls Neon's `consumption_history` API, which is real and
# documented, but wasn't exercised against a live Neon project while writing
# this (no live Neon credentials in the authoring environment) — the first
# manual "Run workflow" should be checked against the Neon dashboard's own
# usage page to confirm the numbers line up before trusting the schedule.

on:
  schedule:
    - cron: "0 22 * * *" # once daily, after the price refresh (18:30 Sydney = ~08:30 UTC; this is well clear of it)
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Neon consumption vs allowance
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ secrets.NEON_DEXCOMPARE_PROJECT_ID }}
          CAP_GB: ${{ secrets.NEON_EGRESS_CAP_GB }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${PROJECT_ID:-}" ]; then
            echo "NEON_API_KEY / NEON_DEXCOMPARE_PROJECT_ID not set — skipping (see the setup comment at the top of this workflow file)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CAP_GB="${CAP_GB:-5}"

          # Pro-rate the alert thresholds by how far through the current UTC
          # month we are, so "50% of monthly cap used" is flagged the moment
          # it's actually running hot, not only once the month is half over.
          DAY=$(date -u +%-d)
          DAYS_IN_MONTH=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%-d)
          MONTH_FRACTION=$(awk -v d="$DAY" -v n="$DAYS_IN_MONTH" 'BEGIN { printf "%.4f", d/n }')

          FROM=$(date -u +%Y-%m-01T00:00:00Z)
          TO=$(date -u -d "+1 day" +%Y-%m-%dT00:00:00Z)

          RESP=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/consumption_history/projects?project_ids[]=${PROJECT_ID}&from=${FROM}&to=${TO}&granularity=monthly")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Neon API returned HTTP $HTTP_CODE — response:"
            echo "$BODY" | head -c 2000
            echo "This may mean the API shape has changed since this workflow was written, or the project/key is wrong. Check https://console.neon.tech/app/projects/${PROJECT_ID}/monitoring directly." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # data_transfer_bytes is the egress figure that actually matters here
          # (storage and compute-hours have their own caps but egress is what
          # killed this project before). Defensive parse: if the field isn't
          # where expected, print the raw body instead of silently reporting 0.
          EGRESS_BYTES=$(echo "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(c.get("data_transfer_bytes",0) for p in d.get("periods",[]) for c in p.get("consumption",[])))' 2>/dev/null || echo 0)

          if [ "$EGRESS_BYTES" = "0" ]; then
            echo "::warning::Could not parse a non-zero egress figure from the Neon API response — printing raw body for debugging (this watchdog needs a look, not necessarily the database):"
            echo "$BODY" | head -c 3000
          fi

          EGRESS_GB=$(awk -v b="$EGRESS_BYTES" 'BEGIN { printf "%.3f", b/1000000000 }')
          PCT_OF_CAP=$(awk -v e="$EGRESS_GB" -v c="$CAP_GB" 'BEGIN { printf "%.1f", (e/c)*100 }')
          PRORATED_CAP_GB=$(awk -v c="$CAP_GB" -v f="$MONTH_FRACTION" 'BEGIN { printf "%.3f", c*f }')
          PCT_OF_PRORATED=$(awk -v e="$EGRESS_GB" -v p="$PRORATED_CAP_GB" 'BEGIN { if (p==0) print "0.0"; else printf "%.1f", (e/p)*100 }')

          SUMMARY="DexCompare Neon egress: **${EGRESS_GB} GB** / ${CAP_GB} GB monthly cap (**${PCT_OF_CAP}%**). Day ${DAY}/${DAYS_IN_MONTH} of the month → pro-rated pace is **${PCT_OF_PRORATED}%** of where a steady burn should be."
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY"

          LEVEL=""
          if awk -v p="$PCT_OF_PRORATED" 'BEGIN{exit !(p>=90)}'; then LEVEL="🔴 90%+ of pro-rated pace"
          elif awk -v p="$PCT_OF_PRORATED" 'BEGIN{exit !(p>=75)}'; then LEVEL="🟠 75%+ of pro-rated pace"
          elif awk -v p="$PCT_OF_PRORATED" 'BEGIN{exit !(p>=50)}'; then LEVEL="🟡 50%+ of pro-rated pace"
          fi

          if [ -n "$LEVEL" ] && [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"⚠️ **DexCompare Neon watchdog** — ${LEVEL}\n${SUMMARY}\nhttps://console.neon.tech/app/projects/${PROJECT_ID}/monitoring\"}" \
              -o /dev/null || echo "Discord post failed (non-fatal)."
          fi
