name: Smoke test DexCompare (live site)

# Read-only smoke test against the production site. Verifies the latest deploy is
# serving and that key pages/copy are present. Runs on GitHub's runners because
# the dev container has no egress to the production domain. The data-gate job
# additionally runs the accuracy CI (verify-data.ts) against the live database.
#
# NOTE: the footer legitimately cross-promotes RiftCompare ("the League of
# Legends TCG"), so there is deliberately NO "Riftbound leftover" grep anymore.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check homepage
        run: |
          set -e
          BODY=$(curl -fsSL --retry 3 https://dexcompare.com/)
          echo "$BODY" | grep -q "Browse by energy type" && echo "OK: energy-type section" || { echo "FAIL: 'Browse by energy type' missing (old deploy?)"; exit 1; }
          echo "$BODY" | grep -q "Official partners" && echo "OK: partners strip" || { echo "FAIL: partners strip missing"; exit 1; }
          echo "$BODY" | grep -q "New sealed arrivals" && echo "OK: sealed arrivals rail" || echo "WARN: sealed arrivals rail not rendering (needs >=3 dated groups)"
          echo "$BODY" | grep -qi 'href="/marketplace' && { echo "FAIL: marketplace links still present"; exit 1; } || echo "OK: marketplace removed"

      - name: Check sealed database page
        run: |
          set -e
          BODY=$(curl -fsSL --retry 3 https://dexcompare.com/sealed)
          echo "$BODY" | grep -qi "sealed products" && echo "OK: /sealed renders" || { echo "FAIL: /sealed heading missing"; exit 1; }
          COUNT=$(echo "$BODY" | grep -o '/sealed/[a-z0-9-]*' | sort -u | wc -l)
          echo "sealed product links: $COUNT"
          test "$COUNT" -ge 10 || { echo "FAIL: fewer than 10 sealed products listed — import data missing?"; exit 1; }

      - name: Check a sealed compare page renders
        run: |
          set -e
          HREF=$(curl -fsSL --retry 3 "https://dexcompare.com/sealed" | grep -o '/sealed/[a-z0-9-]*' | head -1)
          echo "sealed: $HREF"
          test -n "$HREF"
          BODY=$(curl -fsSL --retry 3 "https://dexcompare.com$HREF")
          echo "$BODY" | grep -q "Price comparison" && echo "OK: sealed compare page renders" || { echo "FAIL: sealed compare page broken"; exit 1; }

      - name: Check collection page
        run: |
          set -e
          BODY=$(curl -fsSL --retry 3 https://dexcompare.com/collection)
          echo "$BODY" | grep -qi "My collection" && echo "OK: /collection renders" || { echo "FAIL: /collection missing heading"; exit 1; }

      - name: Check a card page renders
        run: |
          set -e
          HREF=$(curl -fsSL --retry 3 "https://dexcompare.com/browse" | grep -o '/card/[a-z0-9-]*' | head -1)
          echo "card: $HREF"
          test -n "$HREF"
          BODY=$(curl -fsSL --retry 3 "https://dexcompare.com$HREF")
          echo "$BODY" | grep -q "Price comparison" && echo "OK: card page renders" || { echo "FAIL: card page broken"; exit 1; }
          echo "$BODY" | grep -q "Add to collection\|owned" && echo "OK: collection button present" || { echo "FAIL: collection button missing"; exit 1; }

      - name: Check restock tracker
        run: |
          set -e
          BODY=$(curl -fsSL --retry 3 https://dexcompare.com/restock/chaos-rising)
          echo "$BODY" | grep -qi "restock tracker" && echo "OK: tracker renders" || { echo "FAIL: tracker broken"; exit 1; }
          echo "$BODY" | grep -qi "Notify me\|on the list" && echo "OK: alert capture present" || { echo "FAIL: alert form missing"; exit 1; }

      - name: Check SEO surfaces
        run: |
          set -e
          curl -fsSL --retry 3 https://dexcompare.com/sets >/dev/null && echo "OK: /sets serves"
          curl -fsSL --retry 3 https://dexcompare.com/sitemap.xml | grep -q "/sealed" && echo "OK: sitemap includes sealed" || { echo "FAIL: sitemap missing sealed routes"; exit 1; }
          curl -fsSL --retry 3 https://dexcompare.com/ads.txt | grep -q "pub-" && echo "OK: ads.txt serves" || { echo "FAIL: ads.txt broken"; exit 1; }
          curl -fsSL --retry 3 https://dexcompare.com/robots.txt | grep -qi "sitemap" && echo "OK: robots.txt serves" || { echo "FAIL: robots broken"; exit 1; }

  # Accuracy CI against the live DB (read-only checks: guide-leak, suspicious
  # prices vs the TCGplayer guide, priced-count collapse).
  data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve database URL
        id: db
        env:
          SECRET_URL: ${{ secrets.DEXCOMPARE_DATABASE_URL }}
        run: |
          if [ -z "$SECRET_URL" ]; then
            echo "No DEXCOMPARE_DATABASE_URL secret — skipping the data gate." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$SECRET_URL"
            echo "DATABASE_URL=$SECRET_URL" >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'
      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20
      - name: Run accuracy checks
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npx tsx scripts/verify-data.ts
