name: Refresh DexCompare prices (daily)

# Daily live-price refresh for DexCompare: re-scrapes every store feed, updates
# RetailerPrice + each card's lowest price per market, and records the daily
# price-history snapshot that powers the card-page trend chart and the homepage
# "Biggest price movers". The Vercel cron can't do this (the import takes ~an
# hour; serverless functions cap out at minutes), so it runs here on a schedule.
#
# Set the repo secret DEXCOMPARE_DATABASE_URL (the Neon pooled URL) to enable the
# schedule. Until then, scheduled runs skip with a notice; manual runs can paste
# the URL as an input instead.

on:
  schedule:
    - cron: "30 18 * * *" # 04:30 Sydney (AEST) daily, before the AU morning
  workflow_dispatch:
    inputs:
      dexcompare_url:
        description: "DexCompare Neon DATABASE_URL (optional if the DEXCOMPARE_DATABASE_URL secret is set)"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve database URL
        id: db
        env:
          SECRET_URL: ${{ secrets.DEXCOMPARE_DATABASE_URL }}
          INPUT_URL: ${{ inputs.dexcompare_url }}
          HISTORY_URL: ${{ secrets.HISTORY_DATABASE_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "No DEXCOMPARE_DATABASE_URL secret and no URL input — skipping the refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "Add the secret in Settings → Secrets and variables → Actions to enable the daily schedule." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$URL"
            # Secrets can't travel via step outputs; hand it to later steps as an env var.
            echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
            if [ -n "$HISTORY_URL" ]; then
              echo "::add-mask::$HISTORY_URL"
              echo "HISTORY_DATABASE_URL=$HISTORY_URL" >> "$GITHUB_ENV"
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20

      # eBay sourcing is ON for DexCompare (set the EBAY_CLIENT_ID/SECRET secrets).
      # The eBay app quota is SHARED with RiftCompare; both importers read the live
      # remaining-call count from eBay's Analytics API before spending and always
      # stop EBAY_QUOTA_RESERVE calls short, so the two sites self-coordinate and
      # can never exhaust the daily quota between them. DexCompare splits its run
      # budget across AU/US/GB (weights via EBAY_MARKET_WEIGHTS) and rotates
      # through the stalest cards — see src/lib/price-import.ts.
      - name: Import live prices
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          # Additive schema sync (new columns/tables, e.g. PriceAlert, ClickEvent,
          # Card.marketPriceSource, PriceHistory.country) so the import can write
          # them. --accept-data-loss allows the PriceHistory unique-index swap
          # ([cardId,day] → [cardId,country,day]); no rows are dropped.
          npx prisma db push --skip-generate --accept-data-loss
          npx tsx scripts/import-prices.ts

      # Accuracy gate: fail the run if a core data invariant regressed (market
      # guide leaking into headline prices, a spike of cards priced absurdly below
      # their TCGplayer guide, or the priced-card count collapsing vs yesterday).
      - name: Verify data quality
        if: steps.db.outputs.found == 'true'
        working-directory: apps/dexcompare
        run: npx tsx scripts/verify-data.ts

      # Auto-post today's Market Wrap to socials. Runs LAST, after today's
      # PriceHistory snapshot is written, so latestWrapDay() resolves the fresh
      # edition. Best-effort: continue-on-error + the script never throws, so a
      # socials hiccup can't fail the price pipeline. Posts only to whichever
      # accounts have secrets set (all optional) — no secrets = a clean no-op.
      # DATABASE_URL / HISTORY_DATABASE_URL are already on $GITHUB_ENV from the
      # Resolve step; only the social secrets are declared here.
      - name: Post Market Wrap to socials
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        working-directory: apps/dexcompare
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/post-market-wrap.ts
