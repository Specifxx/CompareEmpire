name: DexCompare sealed import

# Reads every store in apps/dexcompare-sealed/src/data/stores.json and TCGplayer's
# Pokémon sealed catalogue (its public search API, ~60 requests, one a second,
# no credentials; src/lib/tcgplayer.ts), replaces the current listings in the
# DexCompare database, then asks the live site to re-render its cached pages.
# Twice a day. No eBay API calls: no eBay credentials are passed to this job at
# all.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DC2                              required (a secret or a variable): the Neon database (2026-10-16). Pooled or
#                                    direct; the job uses its direct host. DEXCOMPARE_SEALED_DATABASE_URL, the old
#                                    project, only while DC2 is unset.
#   DEXCOMPARE_REVALIDATE_SECRET     optional. Same value as REVALIDATE_SECRET in
#                                    Vercel; without it pages refresh within 24h.
# Variable (same page, "Variables" tab):
#   DEXCOMPARE_SITE_URL              e.g. https://dexcompare.app
#
# A NEW secret name on purpose: the paused workflows from the old singles app
# (refresh-dexcompare-prices.yml, seed-dexcompare-fresh.yml, …) read
# DEXCOMPARE_DATABASE_URL and some of them reset the database they point at.

on:
  # A merge that changes the schema syncs it straight away (with a quick
  # TCGplayer-only run that also recomputes every product's stats), so the
  # deploy it triggers never renders against a database missing a column.
  push:
    branches: [main]
    paths: ["apps/dexcompare-sealed/prisma/schema.prisma"]
  schedule:
    # 20:47 UTC ≈ early morning in Australia/NZ; 08:47 UTC ≈ Europe's morning.
    - cron: "47 20 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      # Store keys and markets; "tcgplayer" (or "US") includes TCGplayer.
      only:
        description: "Only these stores or markets, comma-separated (e.g. AU or pokebox,cherry). Blank = all."
        required: false
        default: ""

concurrency:
  group: dexcompare-sealed-import
  cancel-in-progress: false

# Writes the public data snapshot to main after the import (scripts/publish-public-data.sh).
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/dexcompare-sealed
    steps:
      - name: Resolve the database (DC2)
        id: db
        working-directory: .
        # The database is DC2 (owner, 2026-10-16), a secret or a repository variable; DEXCOMPARE_SEALED_DATABASE_URL (the old
        # project) only while DC2 is not set. Its DIRECT host (no "-pooler") goes to every later step as DATABASE_URL, masked.
        env:
          DC2: ${{ secrets.DC2 || vars.DC2 }}
          LEGACY: ${{ secrets.DEXCOMPARE_SEALED_DATABASE_URL }}
        run: |
          URL="${DC2:-$LEGACY}"
          NAME=DC2; [ -z "$DC2" ] && NAME=DEXCOMPARE_SEALED_DATABASE_URL
          if [ -z "$URL" ]; then
            echo "Neither DC2 nor DEXCOMPARE_SEALED_DATABASE_URL is set — nothing to import into." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            DIRECT="$(printf '%s' "$URL" | sed -E 's/-pooler\././')"
            echo "::add-mask::$DIRECT"
            echo "DATABASE_URL=$DIRECT" >> "$GITHUB_ENV"
            echo "DB_SOURCE_NAME=$NAME" >> "$GITHUB_ENV"
            echo "Database: $NAME" >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.db.outputs.found == 'true'

      - uses: actions/setup-node@v4
        if: steps.db.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dexcompare-sealed/package-lock.json

      - name: Install
        if: steps.db.outputs.found == 'true'
        run: npm ci --no-audit --no-fund

      - name: Sync the schema
        if: steps.db.outputs.found == 'true'
        # No --accept-data-loss: a schema change that would drop data fails
        # here, loudly, instead of quietly deleting it.
        run: npx prisma db push --skip-generate && npx prisma generate

      - name: Import
        if: steps.db.outputs.found == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.DEXCOMPARE_REVALIDATE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.DEXCOMPARE_SITE_URL || 'https://dexcompare.app' }}
          ONLY: ${{ github.event_name == 'push' && 'tcgplayer' || inputs.only }}
          # The expired-eBay-listing purge at the end of the import uses the same age bound as the eBay import
          # (a repository variable; blank = 26 hours).
          EBAY_LISTING_MAX_AGE_HOURS: ${{ vars.EBAY_LISTING_MAX_AGE_HOURS }}
        # Three stores at a time: Shopify throttles by IP across all of its
        # storefronts, and a runner reading ten at once gets 429s from stores
        # it has barely touched. TCGplayer is read first, in one of the three
        # slots (~1.5 min, 15 min at most); a failed TCGplayer read keeps its
        # previous rows and warns, and the job fails once TCGplayer has gone
        # unread for 48 hours.
        run: |
          if [ -n "$ONLY" ]; then
            npx tsx scripts/import.ts --concurrency 3 --only "$ONLY"
          else
            npx tsx scripts/import.ts --concurrency 3
          fi

      # The site reads these files, not the database (apps/dexcompare-sealed/src/lib/public-data/): export every public table and
      # commit it to main, which is the release that puts this import's prices live.
      - name: Export the public data
        if: steps.db.outputs.found == 'true'
        run: npx tsx scripts/export-public-data.ts

      # The deal and restock feed (apps/dexcompare-sealed/src/lib/feed.ts): OFF unless the repository variable FEED_ENABLED is 1 and a
      # destination is set (secret DISCORD_WEBHOOK_URL; secret TELEGRAM_BOT_TOKEN with variable TELEGRAM_CHAT_ID). It reads the files
      # just exported, posts at most FEED_MAX_POSTS (default 6) new events, and writes data/public/feed-state.json, which the publish
      # step commits with the data. Never fails the import.
      - name: Deal and restock feed
        if: steps.db.outputs.found == 'true'
        continue-on-error: true
        env:
          FEED_ENABLED: ${{ vars.FEED_ENABLED }}
          FEED_REGIONS: ${{ vars.FEED_REGIONS }}
          FEED_MAX_POSTS: ${{ vars.FEED_MAX_POSTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/feed-notify.ts
      - name: Publish it to main
        if: steps.db.outputs.found == 'true'
        working-directory: .
        # ONE RELEASE A DAY (owner, 2026-10-17: "reduce the cost"). The 20:47 UTC run (early morning in Australia,
        # afternoon in the Americas), a manual run and the schema sync release ("release": the commit subject carries
        # [deploy]); the 08:47 run commits its snapshot without the marker and it rides the next release, which carries a
        # newer whole-database snapshot anyway. Every release empties Vercel's CDN; the 08:47 read still feeds the alerts.
        env:
          PUBLISH_FEED_STATE: "1"
          RELEASE: ${{ (github.event_name != 'schedule' || github.event.schedule == '47 20 * * *') && 'release' || '' }}
        run: bash apps/dexcompare-sealed/scripts/publish-public-data.sh "dexcompare-sealed-import.yml run ${{ github.run_id }}" $RELEASE
