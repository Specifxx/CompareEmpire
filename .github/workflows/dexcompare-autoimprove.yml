name: DexCompare autonomous improver

# Runs Claude Code headless DAILY to make ONE small, verified improvement to
# apps/dexcompare and push it to `main` (the Vercel production branch). It used
# to run every ~20 minutes, which — combined with the monorepo fan-out (every
# push rebuilt all ~11 apps) — blew through the Hobby deploy budget. Now the
# other apps carry an `ignoreCommand: exit 0` build guard, so a push to `main`
# only rebuilds dexcompare (~1 deploy/run) — safe to run daily for compounding
# SEO/UX wins. (Raise/lower the cron below to taste.)
# Scheduled workflows fire only from the DEFAULT branch, so this file lives here
# on the default branch, but it checks out and pushes to `main`.
# The improvement prompt lives at .github/auto-improve-prompt.md on `main`.
#
# AUTH — set ONE of these repo secrets (Settings -> Secrets and variables -> Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  (preferred — uses your Claude Pro/Max subscription;
#       generate via `claude setup-token` in the Claude Code CLI.)
#   ANTHROPIC_API_KEY        (alternative — pay-per-token Anthropic API billing.)
#
# `main` is not protected, so the default GITHUB_TOKEN can push (no PAT needed).
#
# Cost note: runs Claude once a day. GitHub Actions minutes are free on this
# public repo; subscription/API usage is not. To pause: disable this workflow in
# the Actions tab (or delete this file). To re-time, edit the cron below.

on:
  schedule:
    - cron: "0 6 * * *" # daily — 06:00 UTC
  workflow_dispatch:

concurrency:
  group: dexcompare-autoimprove
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main (the production branch we improve + push to)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies + Claude Code
        working-directory: apps/dexcompare
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npm install -g @anthropic-ai/claude-code

      - name: Configure git author
        run: |
          git config user.name "dexcompare-improver[bot]"
          git config user.email "dexcompare-improver@users.noreply.github.com"

      # Close the SEO loop: pull the pages that get Google impressions but low CTR
      # (real demand, few clicks) so the bot rewrites THOSE titles/descriptions
      # first. Writes apps/dexcompare/GSC-TARGETS.md (gitignored, read by the prompt).
      # No-ops without GSC_SA_KEY, and never fails the run.
      - name: Fetch GSC targets (low-CTR / high-impression pages) — optional
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_PROPERTY: "https://dexcompare.app/"
        run: |
          if [ -z "$GSC_SA_KEY" ]; then
            echo "No GSC_SA_KEY — skipping GSC targets; bot works from the static SEO queue."
            exit 0
          fi
          node <<'JS'
          const crypto = require("crypto"); const fs = require("fs");
          const sa = JSON.parse(process.env.GSC_SA_KEY);
          const property = process.env.GSC_PROPERTY;
          const site = encodeURIComponent(property);
          const b64 = (b) => Buffer.from(b).toString("base64").replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
          const day = (n) => new Date(Date.now() - n*864e5).toISOString().slice(0,10);
          async function token(){ const now=Math.floor(Date.now()/1000); const h=b64(JSON.stringify({alg:"RS256",typ:"JWT"})); const c=b64(JSON.stringify({iss:sa.client_email,scope:"https://www.googleapis.com/auth/webmasters.readonly",aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+3600})); const s=crypto.createSign("RSA-SHA256"); s.update(h+"."+c); const jwt=h+"."+c+"."+b64(s.sign(sa.private_key)); const r=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:jwt})}); const j=await r.json(); if(!j.access_token) throw new Error("auth failed: "+JSON.stringify(j)); return j.access_token; }
          async function q(at,body){ const r=await fetch(`https://searchconsole.googleapis.com/webmasters/v3/sites/${site}/searchAnalytics/query`,{method:"POST",headers:{Authorization:"Bearer "+at,"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); }
          (async()=>{
            const at=await token();
            const start=day(28), end=day(2);
            const byPage=await q(at,{startDate:start,endDate:end,dimensions:["page"],rowLimit:25000});
            if(byPage.error) throw new Error("searchAnalytics: "+JSON.stringify(byPage.error));
            const byQuery=await q(at,{startDate:start,endDate:end,dimensions:["query"],rowLimit:25});
            const pages=(byPage.rows||[]).map(r=>({url:r.keys[0],clicks:r.clicks,impr:r.impressions,ctr:r.ctr,pos:r.position}));
            const targets=pages.filter(p=>p.impr>=20&&p.ctr<0.03&&p.pos<=20.5).sort((a,b)=>b.impr-a.impr).slice(0,25);
            const striking=pages.filter(p=>p.pos>=4.5&&p.pos<=20.5&&p.impr>=10).sort((a,b)=>b.impr-a.impr).slice(0,15);
            const q28=(byQuery.rows||[]).map(r=>({q:r.keys[0],clicks:r.clicks,impr:r.impressions,ctr:r.ctr,pos:r.position}));
            const rel=(u)=>u.replace(property.replace(/\/$/,""),"")||"/";
            const out=[];
            out.push(`# GSC targets — auto-generated, last 28d (gitignored, do not commit)`);
            out.push(``,`Highest-leverage title/meta rewrites: pages with real impressions but low`,`CTR (seen in search, few clicks) — a sharper title converts them into clicks.`);
            out.push(``,`## Low-CTR, high-impression pages (rewrite titles/descriptions first)`,`| page | impr | ctr | pos |`,`|---|---|---|---|`);
            for(const p of targets) out.push(`| ${rel(p.url)} | ${p.impr} | ${(p.ctr*100).toFixed(1)}% | ${p.pos.toFixed(1)} |`);
            if(!targets.length) out.push(`| (not enough impressions yet) | | | |`);
            out.push(``,`## Striking distance (rank ~5-20; a nudge reaches page 1)`,`| page | impr | pos |`,`|---|---|---|`);
            for(const p of striking) out.push(`| ${rel(p.url)} | ${p.impr} | ${p.pos.toFixed(1)} |`);
            out.push(``,`## Top queries (last 28d) — align titles/content to these`,`| query | clicks | impr | ctr | pos |`,`|---|---|---|---|---|`);
            for(const x of q28) out.push(`| ${x.q} | ${x.clicks} | ${x.impr} | ${(x.ctr*100).toFixed(1)}% | ${x.pos.toFixed(1)} |`);
            fs.writeFileSync("apps/dexcompare/GSC-TARGETS.md", out.join("\n")+"\n");
            console.log(`GSC targets: ${targets.length} low-CTR, ${striking.length} striking, ${q28.length} queries -> apps/dexcompare/GSC-TARGETS.md`);
          })().catch(e=>{ console.error("GSC targets step failed (non-fatal):",e.message); process.exit(0); });
          JS

      - name: One improvement iteration (Claude Code, headless)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No auth. Set CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token', uses your Pro/Max subscription) or ANTHROPIC_API_KEY in repo secrets."
            exit 1
          fi
          claude -p "$(cat .github/auto-improve-prompt.md)" \
            --dangerously-skip-permissions \
            --max-turns 120 \
            || echo "Claude run exited non-zero — the verify gate below decides whether anything ships."

      - name: Verify & push (rebase onto latest main; only push if green)
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "No new commit this run — nothing to ship."
            exit 0
          fi
          echo "New commit(s):"; git log origin/main..HEAD --oneline
          # main may have advanced since checkout — replay our commit on top of it.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::Rebase conflict with concurrent change — skipping this run's push."
            exit 0
          fi
          # Backstop verify the FINAL tree before it reaches production.
          # (prisma db push is gated on VERCEL_ENV=production, so this never touches a DB.)
          ( cd apps/dexcompare && npx tsc --noEmit )
          ( cd apps/dexcompare && DATABASE_URL="postgresql://u:p@127.0.0.1:5432/none" npx next build )
          # Push, with one rebase+retry if main moved again during verify.
          if ! git push origin HEAD:main; then
            echo "Push rejected — re-syncing and retrying once."
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "::warning::conflict on retry — skipping."; exit 0; }
            git push origin HEAD:main || { echo "::warning::push still failing — skipping this run."; exit 0; }
          fi
          echo "Pushed improvement to main."
